name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: fetch mihomo and geo data
        # 真实内核门禁：生成配置经 `mihomo -t` 校验（见 internal/subscription/realkernel_test.go）
        env:
          DEB_ARCHES: amd64
        run: ./scripts/fetch-deb-deps.sh
      - name: go test
        env:
          MIHOMO_BIN: ${{ github.workspace }}/packaging/deps/amd64/mihomo
        run: go test -race ./...
