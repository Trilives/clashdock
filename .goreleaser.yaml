version: 2
project_name: clashdock

before:
  hooks:
    - go mod tidy

builds:
  - id: clashdock
    main: ./cmd/clashdock
    binary: clashdock
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "arm" -}}armv{{ .Arm }}{{- else -}}{{ .Arch }}{{- end -}}'
    # 便携包内含内核 + 规则 + 脚本多个文件，包成顶层目录避免解压时污染当前目录。
    # 同一个包两种用法：sudo ./install.sh 装成系统服务；直接 ./clashdock 进入用户模式。
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      # 自安装脚本（等效 sudo apt install clashdock_*.deb）
      - src: scripts/portable/install.sh
        dst: install.sh
        info:
          mode: 0755
      - src: scripts/portable/uninstall.sh
        dst: uninstall.sh
        info:
          mode: 0755
      # 用户模式（免 root）：直接运行包内 ./clashdock 即把本体装到 ~/.local/bin、
      # 内核与规则接管到 ~/.local/share/clashdock，并注册用户级服务；之后的更新 /
      # 卸载都在 clashdock 菜单里完成，不再需要包内更新脚本。
      # tool/nettest.sh：不依赖 clashdock 的本机代理网络自测脚本。
      # 刻意不含 Web UI：需要面板可在「工具 → 更新 → Web UI」在线下载。
      - src: scripts/portable/tool/nettest.sh
        dst: tool/nettest.sh
        info:
          mode: 0755
      # mihomo 内核（按架构选取；MIT，见 deps/copyright / deps/LICENSE.mihomo）
      - src: 'packaging/deps/{{- if eq .Arch "arm" -}}armv{{ .Arm }}{{- else -}}{{ .Arch }}{{- end -}}/mihomo'
        dst: deps/mihomo
        info:
          mode: 0755
      # 基础规则种子：离线启动够用，之后可在线更新更大的规则文件
      - src: packaging/deps/rules/geosite.dat
        dst: deps/rules/geosite.dat
      - src: packaging/deps/rules/country.mmdb
        dst: deps/rules/country.mmdb
      # 许可与归属（与 deb 一致）
      - src: packaging/copyright
        dst: deps/copyright
      - src: packaging/deps/LICENSE.mihomo
        dst: deps/LICENSE.mihomo

nfpms:
  - id: deb
    package_name: clashdock
    formats: [deb]
    vendor: Trilives
    homepage: https://github.com/Trilives/clashdock
    maintainer: Trilives <trlives.j@gmail.com>
    description: |-
      Interactive TUI to deploy and manage mihomo (Clash.Meta) on Linux.
      Bundles the mihomo core and basic rule files so the service can start
      offline right after installation; larger rule data can be updated online.
    license: MIT
    section: net
    contents:
      # mihomo 内核（MIT，见 copyright / LICENSE.mihomo）
      - src: 'packaging/deps/{{- if eq .Arch "arm" -}}armv{{ .Arm }}{{- else -}}{{ .Arch }}{{- end -}}/mihomo'
        dst: /usr/libexec/clashdock/mihomo
        file_info:
          mode: 0755
      # 基础规则种子：先能离线启动，之后可在线更新更大的规则文件
      - src: packaging/deps/rules/geosite.dat
        dst: /usr/share/clashdock/ruleset/geosite.dat
      - src: packaging/deps/rules/country.mmdb
        dst: /usr/share/clashdock/ruleset/country.mmdb
      # 许可与归属
      - src: packaging/copyright
        dst: /usr/share/doc/clashdock/copyright
      - src: packaging/deps/LICENSE.mihomo
        dst: /usr/share/doc/clashdock/LICENSE.mihomo

checksum:
  name_template: checksums.txt

# prerelease: auto 让打了 semver 预发布后缀的 tag（如 v0.1.7-beta.1）自动标记
# 为 GitHub prerelease：不会顶替"Latest release"，也不会被 /releases/latest
# 接口返回——self-update 的稳定渠道天然只看得到正式版，预览渠道另走 /releases
# 列表读取最新一项（见 internal/selfupdate）。
#
# header 给出本发行线相较上一个稳定版的要点摘要（changelog 只列本次 tag 增量），
# 让发布说明既准确又简短。prerelease: auto 让带 -beta.N 后缀的 tag 自动标为预发布。
release:
  prerelease: auto
  header: |
    Highlights of v0.3.0 (vs v0.2.6):

    - New **user mode** (replaces portable mode): a second mainstream way to run clashdock with no root at all. Extract the tar.gz and run `./clashdock`; it installs itself to `~/.local/bin`, keeps data in `~/.local/share/clashdock`, and runs mihomo as a `systemctl --user` service (falling back to a detached background process where no user systemd instance exists). No foreground process is needed: node switching, pinning, config changes, pause/resume, updates and uninstall all work against the user service, from the menu or via `clashdock pause|resume|update|uninstall`.
    - User-mode setup checks whether the proxy/controller ports are already taken (common on shared machines) and walks you through picking free ones. The controller port is now configurable (`controller_port`, default 9090).
    - Data from the old portable mode (`clashdock-data` next to the package) is detected and can be migrated in one step; the old directory is left untouched.
    - The tar.gz no longer ships `tool/update.sh`; updates happen inside clashdock. `sudo ./install.sh` still installs the same package as the full system service, equivalent to the .deb.
    - Fixes: ports changed in Deployment Settings were saved as strings and ignored by the running config; updating the Web UI now redeploys; piped (non-TTY) input is no longer swallowed; 20 missing English translations added, with a test that keeps coverage complete.

    Full-mode installs need no config migration.

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
